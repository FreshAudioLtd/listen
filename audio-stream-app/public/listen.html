<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Listen — Audio Stream</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">&larr; Home</a>

    <div class="hero">
      <div id="joinCard" class="hero" style="padding-top:0; gap:18px;">
        <input id="roomInput" class="pill" type="text" maxlength="16" placeholder="ROOM CODE" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" />
        <button id="joinBtn" class="pill pill-accent">Join to Listen</button>
        <p id="joinError" class="error-text"></p>
      </div>

      <div id="liveCard" class="hero" style="padding-top:0; gap:18px; display:none">
        <div class="status-row">
          <span id="statusDot" class="dot connecting"></span>
          <span id="statusText">Connecting…</span>
        </div>

        <div class="meter"><div id="meterFill" class="meter-fill"></div></div>

        <div class="volume-row">
          <span>🔈</span>
          <input id="volumeSlider" type="range" min="0" max="100" value="100" />
          <span>🔊</span>
        </div>

        <div class="controls">
          <button id="leaveBtn" class="pill pill-danger">Leave</button>
        </div>

        <audio id="player" autoplay playsinline></audio>
      </div>
    </div>

    <p class="hint">
      Tip: if audio doesn't start automatically, tap "Join to Listen" again — some browsers block
      autoplay until you interact with the page.
    </p>

    <div class="brand-footer">
      <div class="brand-logos">
        <img class="logo-square" src="/assets/logos/fresh-audio.png" alt="Fresh Audio" />
        <img class="logo-wide" src="/assets/logos/netflix.png" alt="Netflix" />
      </div>
      <div class="brand-divider"></div>
      <div class="brand-studio">
        <img src="/assets/logos/studio99-mark.png" alt="" />
        <img src="/assets/logos/studio99-text.png" alt="Studio 99" style="height:16px" />
      </div>
    </div>
  </div>

  <script src="/client.js"></script>
  <script src="/listen.js"></script>
</body>
</html>
